name: Publish NPCs and Shops hero

on:
  push:
    paths:
      - ".github/workflows/publish-npc-hero.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore publication bundle
        run: |
          base64 --decode .github/npc-hero-release.zip.b64 > npc-hero-release.zip
          unzip -o npc-hero-release.zip -d .

      - name: Validate content
        run: |
          test -f index.html
          test -f Wiki-Digital-Galaxy.html
          test -f NPCs_Lojas_Hero.jpg
          grep -q 'NPCs_Lojas_Hero.jpg' index.html
          grep -q 'block.npcs.hashima' index.html
          grep -q 'block.npcs.babel' index.html
          grep -q 'block.novato.passes' index.html
          grep -q 'Conteúdo em ajuste' index.html
          test "$(grep -c 'Craft adicional:' index.html)" -eq 5
          cmp -s index.html Wiki-Digital-Galaxy.html

      - name: Commit publication
        run: |
          rm -f npc-hero-release.zip
          rm -f .github/npc-hero-release.zip.b64
          rm -f .github/workflows/publish-npc-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Wiki-Digital-Galaxy.html NPCs_Lojas_Hero.jpg
          git add .github/npc-hero-release.zip.b64 .github/workflows/publish-npc-hero.yml
          git commit -m "Add NPCs and Shops hero artwork"
          git push
