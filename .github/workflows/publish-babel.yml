name: Publish Babel wiki content

on:
  push:
    paths:
      - ".github/workflows/publish-babel.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore publication bundle
        run: |
          base64 --decode .github/babel-release.zip.b64 > babel-release.zip
          unzip -o babel-release.zip -d .

      - name: Validate content
        run: |
          test -f index.html
          test -f Wiki-Digital-Galaxy.html
          test -f Babel_NPC.png
          test -f Babel_Banners_Disponiveis.jpg
          grep -q 'block.npcs.babel' index.html
          grep -q 'Conteúdo em ajuste' index.html
          test "$(grep -c 'Craft adicional:' index.html)" -eq 5
          cmp -s index.html Wiki-Digital-Galaxy.html

      - name: Commit publication
        run: |
          rm -f babel-release.zip
          rm -f .github/babel-release.zip.b64
          rm -f .github/workflows/publish-babel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Wiki-Digital-Galaxy.html
          git add Babel_Bilhete_Invocador_Lendario.png Babel_Bilhete_Invocador_Raro.png Babel_Bilhete_Invocacao_Temporada.png Babel_NPC.png
          git add Babel_Banners_Disponiveis.jpg Babel_Selecao_Banner.jpg Babel_Taxas_Gacha.jpg
          git add .github/babel-release.zip.b64 .github/workflows/publish-babel.yml
          git commit -m "Add Babel NPC guide"
          git push
