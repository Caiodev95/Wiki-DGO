name: Publish automatic passes guide

on:
  push:
    paths:
      - ".github/workflows/publish-passes-guide.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore publication bundle
        run: |
          base64 --decode .github/passes-guide-release.zip.b64 > passes-guide-release.zip
          unzip -o passes-guide-release.zip -d .

      - name: Validate content
        run: |
          test -f index.html
          test -f Wiki-Digital-Galaxy.html
          test -f Guia_Ticket_Admission.jpg
          test -f Guia_Passes_Hard_Hashima.jpg
          grep -q 'block.novato.passes' index.html
          grep -q 'novato-passes' index.html
          grep -q 'Conteúdo em ajuste' index.html
          test "$(grep -c 'Craft adicional:' index.html)" -eq 5
          cmp -s index.html Wiki-Digital-Galaxy.html

      - name: Commit publication
        run: |
          rm -f passes-guide-release.zip
          rm -f .github/passes-guide-release.zip.b64
          rm -f .github/workflows/publish-passes-guide.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Wiki-Digital-Galaxy.html
          git add Guia_Ticket_Admission.jpg Guia_Passes_Hard_Hashima.jpg
          git add .github/passes-guide-release.zip.b64 .github/workflows/publish-passes-guide.yml
          git commit -m "Add automatic dungeon pass guide"
          git push
